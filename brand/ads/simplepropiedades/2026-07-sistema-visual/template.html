<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SimplePropiedades Ad</title>
  <style>
    :root {
      --primary: #4F46E5;
      --deep: #312E81;
      --text: #0C0C0E;
      --gray: #6B7280;
      --gray-muted: #9CA3AF;
      --bg: #F7F7F5;
      --surface: #FFFFFF;
      --border: #E8E8E6;
      --radius-btn: 12px;
      --radius-card: 16px;
      --shadow-card: 0 10px 28px rgba(15, 23, 42, 0.10);
      --shadow-cta: 0 12px 28px rgba(79, 70, 229, 0.32);
      --w: 1080px;
      --h: 1920px;
      --side: 64px;
      --safe-top: 290px;
      --safe-bottom: 400px;
      --gap: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      background: var(--bg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--text);
    }

    .canvas {
      position: relative;
      width: var(--w);
      height: var(--h);
      background:
        radial-gradient(ellipse 60% 42% at 10% 88%, rgba(79,70,229,0.14), transparent 68%),
        radial-gradient(ellipse 55% 40% at 92% 18%, rgba(79,70,229,0.12), transparent 70%),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(79,70,229,0.08), transparent 70%),
        var(--bg);
      overflow: hidden;
    }

    .stack {
      position: absolute;
      left: var(--side);
      right: var(--side);
      top: var(--safe-top);
      bottom: var(--safe-bottom);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dots {
      position: absolute;
      width: 72px;
      height: 112px;
      background-image: radial-gradient(circle, var(--gray-muted) 2px, transparent 2.5px);
      background-size: 14px 14px;
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    .dots-l { left: 36px; top: 58%; }
    .dots-r { right: 36px; top: 42%; }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .brand img {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      display: block;
    }
    .brand .wm {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .brand .wm .s { color: var(--text); }
    .brand .wm .p { color: var(--primary); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--deep);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 10px 20px;
      border-radius: var(--radius-btn);
      margin-bottom: 18px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .badge svg { width: 18px; height: 18px; }

    .title {
      text-align: center;
      font-size: 56px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .title .accent { color: var(--primary); display: block; }

    .subtitle {
      text-align: center;
      color: var(--gray);
      font-size: 25px;
      font-weight: 400;
      line-height: 1.35;
      max-width: 860px;
      margin-bottom: 22px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      margin-bottom: 18px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 20px 14px 18px;
      text-align: center;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
    }
    .card .icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      background: rgba(79, 70, 229, 0.10);
      display: grid;
      place-items: center;
    }
    .card .icon-wrap svg {
      width: 26px;
      height: 26px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .card p {
      color: var(--primary);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      white-space: pre-line;
    }

    .hero {
      width: 100%;
      flex: 1 1 auto;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }
    .hero img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 18px 40px rgba(15, 23, 42, 0.14));
    }

    .footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    /* Story: more room for hero cluster (full phone+building+card, no crop) */
    .format-story {
      --w: 1080px;
      --h: 1920px;
      --safe-top: 200px;
      --safe-bottom: 240px;
      --side: 56px;
    }
    .format-story .brand { margin-bottom: 12px; }
    .format-story .badge { margin-bottom: 14px; }
    .format-story .title { font-size: 52px; margin-bottom: 10px; }
    .format-story .subtitle { font-size: 23px; margin-bottom: 16px; }
    .format-story .cards { margin-bottom: 10px; gap: 14px; }
    .format-story .card { min-height: 132px; padding: 16px 12px 14px; gap: 10px; }
    .format-story .hero { min-height: 720px; margin-bottom: 10px; }
    .format-post {
      --w: 1080px;
      --h: 1350px;
      --safe-top: 36px;
      --safe-bottom: 48px;
      --side: 48px;
    }
    .format-post .brand { margin-bottom: 10px; }
    .format-post .brand img { width: 48px; height: 48px; border-radius: 12px; }
    .format-post .brand .wm { font-size: 30px; }
    .format-post .title { font-size: 42px; margin-bottom: 8px; }
    .format-post .subtitle { font-size: 20px; margin-bottom: 12px; }
    .format-post .card { min-height: 118px; padding: 12px 10px 12px; gap: 8px; }
    .format-post .card p { font-size: 18px; }
    .format-post .badge { margin-bottom: 10px; padding: 8px 16px; font-size: 14px; }
    .format-post .cards { margin-bottom: 8px; gap: 12px; }
    .format-post .hero { min-height: 520px; margin-bottom: 8px; }
    .format-post .footer { gap: 12px; }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 440px;
      height: 70px;
      padding: 0 36px;
      background: var(--primary);
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      border-radius: var(--radius-btn);
      box-shadow: var(--shadow-cta);
      border: none;
    }
    .cta svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .format-post .cta { min-width: 400px; height: 64px; font-size: 24px; }

    .url {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--primary);
      font-size: 24px;
      font-weight: 600;
    }
    .url svg { width: 22px; height: 22px; stroke: var(--primary); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .format-post .url { font-size: 22px; }
  </style>
</head>
<body>
  <div class="canvas format-FORMAT" id="ad">
    <div class="dots dots-l" aria-hidden="true"></div>
    <div class="dots dots-r" aria-hidden="true"></div>

    <div class="stack">
      <div class="brand">
        <img src="LOGO_SRC" alt="" width="58" height="58" />
        <div class="wm"><span class="s">Simple</span><span class="p">Propiedades</span></div>
      </div>

      <div class="badge">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 15.9 7.2 18l.9-5.4L4.2 8.7l5.4-.8z"/></svg>
        <span>BADGE_TEXT</span>
      </div>

      <h1 class="title">TITLE_HTML</h1>
      <p class="subtitle">SUBTITLE_TEXT</p>

      <div class="cards">
        CARD_HTML
      </div>

      <div class="hero">
        <img src="HERO_SRC" alt="" />
      </div>

      <div class="footer">
        <div class="cta">
          <svg viewBox="0 0 24 24"><path d="M10 14l11-11"/><path d="M21 3L14.5 21a.55.55 0 0 1-1 0L10 14 3 10.5a.55.55 0 0 1 0-1L21 3"/></svg>
          <span>CTA_TEXT</span>
        </div>
        <div class="url">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M12 3a15 15 0 0 1 0 18"/><path d="M12 3a15 15 0 0 0 0 18"/></svg>
          <span>URL_TEXT</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
